name: Link Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Run link checker
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          token: ${{ github.token }}
          args: >-
            --verbose --no-progress
            --accept 200,403,429
            --max-retries 5 --retry-wait-time 3 --timeout 30
            README.md docs/**/*.md examples/**/*.md
            data/README.md docker/README.md NOTICE.md
          fail: true
