name: Publish container images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Image version without a leading v
        required: true
        default: 0.2.3

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - variant: full
            dockerfile: docker/Dockerfile
            suffix: ""
          - variant: core
            dockerfile: docker/Dockerfile.core
            suffix: -core
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable image version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            value="${GITHUB_REF_NAME#v}"
          else
            value="${DISPATCH_VERSION#v}"
          fi
          [[ "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Build and publish ${{ matrix.variant }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: SOURCE_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/ncdcbioinformatics/cure-ngs-harmonizer:${{ steps.version.outputs.value }}${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/NCDCbioinformatics/cure-ngs-panel-harmonization-framework
