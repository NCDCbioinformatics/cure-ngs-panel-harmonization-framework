name: Publish container images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Image version without a leading v
        required: true
        default: 0.2.6

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - variant: full
            dockerfile: docker/Dockerfile
            suffix: ""
          - variant: core
            dockerfile: docker/Dockerfile.core
            suffix: -core
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable image version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            value="${GITHUB_REF_NAME#v}"
          else
            value="${DISPATCH_VERSION#v}"
          fi
          [[ "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Build the exact candidate for execution
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          build-args: SOURCE_REVISION=${{ github.sha }}
          tags: cure-ngs:release-test
      - name: Gate publication on the executable tutorial
        env:
          CURE_NGS_IMAGE: cure-ngs:release-test
          CURE_NGS_SKIP_PULL: "1"
        run: bash scripts/run_beginner_tutorial.sh
      - name: Gate full-image publication on actual VEP/vcf2maf execution
        if: matrix.variant == 'full'
        env:
          CURE_NGS_FULL_IMAGE: cure-ngs:release-test
        run: bash scripts/run_vep_smoke.sh
      - name: Verify image-contained command without source or reference mounts
        run: |
          mkdir -p image-self-test-output
          docker run --rm --network none --read-only --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:size=256m,mode=1777 --security-opt no-new-privileges:true \
            --volume "$PWD/image-self-test-output:/data/output" \
            cure-ngs:release-test self-test /data/output --profile ${{ matrix.variant }}
      - name: Build and publish ${{ matrix.variant }} image after verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: SOURCE_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/ncdcbioinformatics/cure-ngs-harmonizer:${{ steps.version.outputs.value }}${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/NCDCbioinformatics/cure-ngs-panel-harmonization-framework

  public-release:
    # A release page must not advertise images that failed their execution gate.
    needs: publish
    if: github.event_name == 'push' && github.ref_name == 'v0.2.6'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Verify anonymous installation of the published images
        env:
          CURE_NGS_VERSION: 0.2.6
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          bash scripts/verify_public_install.sh
      - name: Create the authorized release from its existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -s docs/RELEASE_NOTES_0.2.6.md
          bash scripts/render_release_notes.sh "$RELEASE_TAG" \
            docs/RELEASE_NOTES_0.2.6.md > release-notes.md
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "CURE-NGS $RELEASE_TAG" \
            --notes-file release-notes.md
