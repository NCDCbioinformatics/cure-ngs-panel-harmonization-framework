name: Repository Health

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Verify core repository metadata
        shell: bash
        run: |
          test -f README.md
          test -f LICENSE
          test -f NOTICE.md
          test -f CITATION.cff
          test -f docs/MANUSCRIPT_DECLARATIONS.md
          test -f docs/SOFTWARE_INVENTORY.md
          test -f docs/INSTALLATION.md
          test -f docs/BEGINNER_TUTORIAL.md
          test -f docs/CLEAN_UBUNTU_VALIDATION.md
          test -f docs/ACCOUNT_VERSION_AUDIT.md
          test -f docs/PROJECT_STRUCTURE.md
          test -f docs/REFERENCE_DATA.md
          test -f docs/COMMAND_REFERENCE.md
          test -f docs/REVIEWER_REPRODUCTION.md
          test -f scripts/run_reviewer_demo.sh
          test -f scripts/run_beginner_tutorial.sh
          test -f scripts/run_full_annotation_tutorial.sh
          test -f scripts/verify_public_install.sh
          test -f scripts/run_beginner_tutorial.ps1
          test -f examples/public/vcf2maf/test_b37.vcf
          test -f examples/component-tests/manifest.json
          test -f examples/component-tests/inputs/MSKCC_VCCF_test.zip
          test -f examples/component-tests/expected/test_b37.maf
          test -f data/README.md

      - name: Verify required text markers
        shell: bash
        run: |
          grep -q "cure-ngs-panel-harmonization-framework" README.md
          grep -q "MIT License" LICENSE
          grep -q "repository-code" CITATION.cff
          grep -q "Data Availability declaration" docs/MANUSCRIPT_DECLARATIONS.md
          grep -q "Competing Interest declaration" docs/MANUSCRIPT_DECLARATIONS.md
          grep -q "Beginner six-component tutorial passed" scripts/run_beginner_tutorial.sh
          grep -q "CURE-NGS public installation verified" scripts/verify_public_install.sh
          grep -q "export-tutorial-data" docs/BEGINNER_TUTORIAL.md
          grep -q "export-v1.3.3-example" docs/BEGINNER_TUTORIAL.md
          grep -Fq 'NGS_VCF/VCF_ALL/test_b37.vcf' scripts/run_reviewer_demo.sh
          grep -q -- "--workspace-root" docs/V1.3.3_BATCH_WORKFLOW.md
          grep -q "release-baseline-0.2.4" resources/tools.lock.json
          grep -q "cure-ngs-harmonizer:0.2.4" compose.yaml
          grep -q "Public Image Verification run 33350796468" docs/CLEAN_UBUNTU_VALIDATION.md
          grep -q "Current unified distribution" docs/ACCOUNT_VERSION_AUDIT.md
          if git grep -nE 'cure-ngs-harmonizer:0\.(1\.0|2\.[0-3])' -- \
            ':!docs/CLEAN_UBUNTU_VALIDATION.md' \
            ':!docs/ACCOUNT_VERSION_AUDIT.md'; then
            echo "Outdated unified Docker image tag found" >&2
            exit 1
          fi
          if git grep -n 'KOSMOS_VCF' -- ':!.github/workflows/repo-health.yml'; then
            echo "Obsolete KOSMOS_VCF tutorial path found; use NGS_VCF" >&2
            exit 1
          fi
          bash -n scripts/run_beginner_tutorial.sh
          bash -n scripts/run_full_annotation_tutorial.sh
          bash -n scripts/verify_public_install.sh
