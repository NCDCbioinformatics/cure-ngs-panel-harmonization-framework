name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  component-releases:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Verify all six latest GitHub Release locks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/verify_component_releases.py --check-latest

  python:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install exact test dependencies
        run: |
          python -m pip install --require-hashes --requirement requirements-runtime.txt
          python -m pip install --requirement requirements-test.txt
      - name: Install package without resolving dependencies
        run: python -m pip install --no-deps --editable .
      - name: Run unit tests and enforce coverage floor
        run: >-
          python -m pytest
          --cov=cure_ngs
          --cov-report=term-missing
          --cov-fail-under=70

  container:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Build digest- and version-pinned core image
        run: >-
          docker build
          --build-arg SOURCE_REVISION=${{ github.sha }}
          --file docker/Dockerfile.core
          --tag cure-ngs:test .
      - name: Prepare output directory for non-root UID 10001
        run: mkdir ci-output && chmod 0777 ci-output
      - name: Exercise CSV regression under hardened container settings
        run: |
          docker run --rm --read-only --tmpfs /tmp:size=64m \
            --security-opt no-new-privileges:true \
            --volume "$PWD/tests/fixtures/synthetic:/data/input:ro" \
            --volume "$PWD/ci-output:/data/output" \
            cure-ngs:test \
            normalize-hgvs-table \
            /data/input/hgvs_input.csv /data/output/hgvs_output.csv \
            --delimiter comma
          grep --fixed-strings 'institution-A_sample-000000123' ci-output/hgvs_output.csv
          test -s ci-output/hgvs_output.csv.manifest.json
      - name: Exercise left-alignment and multiallelic splitting
        run: |
          docker run --rm --read-only --tmpfs /tmp:size=64m \
            --security-opt no-new-privileges:true \
            --volume "$PWD/tests/fixtures/synthetic:/data/input:ro" \
            --volume "$PWD/ci-output:/data/output" \
            cure-ngs:test \
            normalize-vcf \
            /data/input/normalize.grch38.vcf /data/output/normalized.vcf \
            --reference-fasta /data/input/tiny.grch38.fa --assembly GRCh38
          test "$(grep -vc '^#' ci-output/normalized.vcf)" -eq 4
          test -s ci-output/normalized.vcf.manifest.json
      - name: Exercise canonical cross-route concordance
        run: |
          docker run --rm --read-only --tmpfs /tmp:size=64m \
            --security-opt no-new-privileges:true \
            --volume "$PWD/tests/fixtures/synthetic:/data/input:ro" \
            --volume "$PWD/ci-output:/data/output" \
            cure-ngs:test \
            compare-maf-routes /data/output/concordance \
            --reference-maf /data/input/concordance_direct.grch38.maf \
            --query-maf /data/input/concordance_report.grch38.maf \
            --reference-require-any HGVSc \
            --reference-fasta /data/input/tiny.grch38.fa
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(
              Path("ci-output/concordance/concordance_summary.json").read_text()
          )
          assert summary["overall"]["concordant"] == 3
          assert summary["overall"]["exact_set_agreement_percent"] == 100.0
          assert summary["canonicalization"]["reference"][
              "multiallelic_source_rows_split"
          ] == 1
          assert summary["canonicalization"]["reference"][
              "allele_records_before_normalization"
          ] == 3
          PY
      - name: Reproduce the manuscript V1.3.3 folder and log contract
        run: |
          mkdir -p ci-output/NGS_VCF/VCF_ALL
          chmod 0777 ci-output/NGS_VCF
          cp examples/synthetic/batch-input/empty.grch37.vcf \
            ci-output/NGS_VCF/VCF_ALL/
          docker run --rm --read-only --tmpfs /tmp:size=64m \
            --security-opt no-new-privileges:true \
            --volume "$PWD/ci-output:/data/output" \
            cure-ngs:test \
            batch-vcf-to-maf \
            --workspace-root /data/output/NGS_VCF \
            --reference-config /opt/cure-ngs/examples/synthetic/reference-config.reviewer.json \
            --jobs 1
          test -d ci-output/NGS_VCF/VCF_ALL
          test -d ci-output/NGS_VCF/VCF_ALL_LOG
          test -d ci-output/NGS_VCF/VCF_ALL_MAF
          test -d ci-output/NGS_VCF/VCF_ALL_TMP
          test -s ci-output/NGS_VCF/VCF_ALL_MAF/empty.grch37.maf
          test -s ci-output/NGS_VCF/VCF_ALL_LOG/manifests/empty.grch37.maf.manifest.json
          head -n 1 ci-output/NGS_VCF/VCF_ALL_LOG/vcf2maf_batch_log.tsv | \
            grep -F $'datetime\tvcf_path\tsample_tag8\tref_info\tis_gvcf\thas_normal\tstatus\tmessage\tfinal_vcf'
      - name: Run the complete beginner six-component walkthrough
        env:
          CURE_NGS_IMAGE: cure-ngs:test
          CURE_NGS_SKIP_PULL: "1"
        run: bash scripts/run_beginner_tutorial.sh
